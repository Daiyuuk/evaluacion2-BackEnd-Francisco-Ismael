{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inicio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>

    <header class="sitio-header">
        <div class="contenedor sitio-header__fila">
            <a class="marca" href="{% url 'inicio' %}">Cartelera</a>
            <nav class="nav" aria-label="Principal">
                <a href="{% url 'inicio' %}"{% if request.resolver_match.url_name == 'inicio' %} aria-current="page"{% endif %}>Inicio</a>
                <a href="{% url 'menu_peliculas' %}"{% if request.resolver_match.url_name == 'menu_peliculas' %} aria-current="page"{% endif %}>Películas</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}

</body>
</html>
